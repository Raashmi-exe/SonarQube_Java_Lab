# Alternative configuration for SonarScanner CLI.
# If you use: mvn clean verify sonar:sonar
# Maven reads the project properties from pom.xml instead.
sonar.projectKey=sonarqube-java-lab
sonar.projectName=SonarQube Java Lab
sonar.projectVersion=1.0.0
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000
